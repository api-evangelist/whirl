name: Whirl
description: 'Whirl AI is an enterprise IT platform that uses AI agents to help IT teams understand,
  enhance, and transform business processes and core systems. It automates research and impact
  analysis, generates business requirements, epics and user stories, and accelerates configuration
  and code changes across applications and integrations, compressing enterprise system changes from
  weeks and months into days and hours. Whirl runs on dedicated single-tenant AWS infrastructure per
  customer with immutable, versioned, auditable pipelines (no SSH access), FIDO2 device-based access,
  and SOC 2 Type II compliance. Founded by former Snowflake CIO Sunny Bedi and backed by ICONIQ, with
  advisors from Okta, Splunk, and VMware.'
